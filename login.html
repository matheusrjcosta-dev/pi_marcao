<head>
    <meta charset="UTF-8">

    <link rel="icon" href="icone.png" type="image/x-icon">
    <link rel="stylesheet" href="login.css">
</head>

<!-- ==============================================================================
            Corpo do Documento
        ================================================================================ -->

<body>
    <div class="container-principal">

        <!-- ==============================================================================
                Barra Lateral com Logo
             ================================================================================ -->

        <aside class="barra-lateral">
            <div class="logo">
                <img src="logo.jpg" alt="Logo do Sistema">
            </div>
        </aside>

        <!-- ==============================================================================
                Conteúdo Principal
             ================================================================================ -->

        <main>
            <div class="conteudo-central">

                <!-- ==============================================================================
                        Cabeçalho e Toggle de Seções
                     ================================================================================ -->

                <!-- Cabeçalho -->
                <header class="cabecalho-principal">
                    <h1>Seja bem-vindo</h1>

                    <!-- Toggle estilo Pílula -->
                    <div class="botoes-toggle">
                        <button type="button" id="btn-toggle-login" class="btn-toggle ativo"
                            onclick="exibirSecao('login')">Entrar</button>
                        <button type="button" id="btn-toggle-registro" class="btn-toggle"
                            onclick="exibirSecao('registro')">Registrar</button>
                    </div>

                    <p class="subtitulo">Insira os seus dados para aceder à plataforma.</p>
                </header>

                <!-- ==============================================================================
                        formulários de Login e Registro
                     ================================================================================ -->

                <!-- Formulário de Login -->
                <section id="secao-login" class="secao-form ativa">
                    <form action="login.php" method="post">
                        <div class="campo-grupo">
                            <label for="usuario">Nome</label>
                            <input type="text" id="usuario" name="usuario" placeholder="Insira seu nome de usuário"
                                required>
                        </div>

                        <div class="campo-grupo">
                            <label for="senha">Senha</label>
                            <div class="input-com-icone">
                                <input type="password" id="senha" name="senha" placeholder="Insira sua senha" required>
                            </div>
                        </div>

                        <div class="opcoes-login">
                            <label class="remember-me">
                                <input type="checkbox" name="lembrar">
                                <span>Relembre-me</span>
                            </label>
                            <a href="#" class="forgot-password">Esqueci minha senha?</a>
                        </div>

                        <div class="botoes-acao">
                            <button type="button" class="btn-voltar">Voltar</button>
                            <button type="submit" class="btn-entrar">Entrar</button>
                        </div>
                    </form>
                </section>

                <!-- Formulário de Registro -->
                <section id="secao-registro" class="secao-form">
                    <form action="registro.php" method="post">
                        <div class="campo-grupo">
                            <label for="novo_email">Email</label>
                            <input type="email" id="novo_email" name="novo_email" placeholder="Insira o seu email"
                                required>
                        </div>

                        <div class="campo-grupo">
                            <label for="rga">RGA (até 9 dígitos)</label>
                            <input type="text" id="rga" name="rga" inputmode="numeric" maxlength="9" pattern="[0-9]*"
                                placeholder="Ex: 123456789" required
                                oninput="this.value = this.value.replace(/[^0-9]/g, '')">
                        </div>

                        <div class="campo-grupo">
                            <label for="nome">Nome</label>
                            <input type="text" id="nome" name="nome" placeholder="Insira o seu nome completo" required>
                        </div>

                        <div class="campo-grupo">
                            <label for="nova_senha">Senha</label>
                            <input type="password" id="nova_senha" name="nova_senha" placeholder="Insira a sua senha"
                                required>
                        </div>

                        <div class="campo-grupo">
                            <label for="confirmar_senha">Confirmar Senha</label>
                            <input type="password" id="confirmar_senha" name="confirmar_senha"
                                placeholder="Confirme a sua senha" required>
                        </div>

                        <div class="botoes-acao">
                            <button type="button" class="btn-voltar" onclick="exibirSecao('login')">Voltar</button>
                            <button type="submit" class="btn-entrar">Cadastrar</button>
                        </div>
                    </form>
                </section>
            </div>
        </main>
    </div>

    <!-- ==============================================================================
            script para controle das seções
        ================================================================================ -->
    <script>
        function exibirSecao(secao) {
            // Esconde as seções
            document.getElementById('secao-login').classList.remove('ativa');
            document.getElementById('secao-registro').classList.remove('ativa');

            // Reseta os botões da pílula
            document.getElementById('btn-toggle-login').classList.remove('ativo');
            document.getElementById('btn-toggle-registro').classList.remove('ativo');

            // Activa a seção e o botão correspondente
            if (secao === 'login') {
                document.getElementById('secao-login').classList.add('ativa');
                document.getElementById('btn-toggle-login').classList.add('ativo');
            } else if (secao === 'registro') {
                document.getElementById('secao-registro').classList.add('ativa');
                document.getElementById('btn-toggle-registro').classList.add('ativo');
            }
        }

    </script>
